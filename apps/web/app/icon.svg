<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 9" shape-rendering="crispEdges">
  <title>Lomi Labs</title>
  <defs>
    <rect id="claw" width="2" height="2" fill="#3979bc"/>
    <g id="body">
      <g fill="#3979bc">
        <rect x="3.5" y="6.5" width="1.4" height="3.1"/>
        <rect x="6" y="6.5" width="1.4" height="3.1"/>
        <rect x="8.5" y="6.5" width="1.4" height="3.1"/>
      </g>
      <rect x="2" y="2.5" width="9" height=".8" fill="#7eafe3"/>
      <rect x="2" y="3.3" width="9" height="4.2" fill="#4189d6"/>
    </g>
    <g id="eyes">
      <g fill="#1a1a1a">
        <rect x="3.8" y="4.2" width="1.6" height="1.6"/>
        <rect x="8.2" y="4.2" width="1.6" height="1.6"/>
      </g>
      <g fill="white">
        <rect x="4" y="4.4" width=".5" height=".5"/>
        <rect x="8.4" y="4.4" width=".5" height=".5"/>
      </g>
    </g>
    <g id="happy">
      <path fill="#1a1a1a" d="M3.8 4.4h1.6v1.2h-.45v-.75h-.7v.75H3.8z M8.2 4.4h1.6v1.2h-.45v-.75h-.7v.75H8.2z"/>
      <g fill="white">
        <rect x="2.3" y="6.05" width=".9" height=".22" transform="rotate(-42 2.75 6.16)"/>
        <rect x="2.85" y="6.05" width=".9" height=".22" transform="rotate(-42 3.3 6.16)"/>
        <rect x="3.4" y="6.05" width=".9" height=".22" transform="rotate(-42 3.85 6.16)"/>
        <rect x="9.4" y="6.05" width=".9" height=".22" transform="rotate(42 9.85 6.16)"/>
        <rect x="9.95" y="6.05" width=".9" height=".22" transform="rotate(42 10.4 6.16)"/>
        <rect x="10.5" y="6.05" width=".9" height=".22" transform="rotate(42 10.95 6.16)"/>
      </g>
    </g>
    <g id="brows" fill="#1a1a1a">
      <rect x="3.8" y="3.4" width="1.6" height=".42" transform="rotate(20 4.6 3.61)"/>
      <rect x="8.2" y="3.4" width="1.6" height=".42" transform="rotate(-20 9 3.61)"/>
    </g>
    <path id="arc" d="M180.66 385.81A78 78 0 0 1 331.34 385.81"/>
    <g id="anger-lines"><use href="#arc"/><use href="#arc" transform="rotate(120 256 256)"/><use href="#arc" transform="rotate(240 256 256)"/></g>
    <symbol id="anger" viewBox="0 0 512 512" fill="none" stroke-linecap="round">
      <use href="#anger-lines" stroke="#141414" stroke-width="60"/>
      <use href="#anger-lines" stroke="#b0281f" stroke-width="40"/>
    </symbol>
  </defs>
  <use href="#claw" y="1"/>
  <use href="#claw" x="11" y="1"/>
  <use href="#body"/>
  <use href="#eyes"/>
</svg>
