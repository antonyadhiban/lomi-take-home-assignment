# Isolated stack for Playwright: `docker compose -p lomi-e2e -f docker-compose.yml -f docker-compose.e2e.yml up`
# Own volumes (project-scoped), no host ports for infra, UI/API on 3100/4100, deterministic fake LLM.
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  s3:
    ports: !reset []
  migrate:
    environment:
      EXTRACTION_PROVIDER: fake
  worker:
    environment:
      EXTRACTION_PROVIDER: fake
      OPENROUTER_API_KEY: ""
  api:
    ports: !override ["4100:4000"]
    environment:
      CORS_ORIGINS: http://localhost:3100
  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4100
    ports: !override ["3100:3000"]
